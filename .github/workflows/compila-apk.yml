name: Compila FCD Agenda APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Estrai il progetto Android
        run: |
          base64 -d android-source.tar.xz.b64 | tar -xJf -
          test -f app/build.gradle
          test -f app/src/main/java/it/fcdstudio/agenda/MainActivity.java
      - name: Imposta Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Imposta SDK Android
        uses: android-actions/setup-android@v3
      - name: Installa SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Imposta Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compila APK
        run: gradle --no-daemon assembleDebug
      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: FCD-Studio-Legale-Agenda-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
